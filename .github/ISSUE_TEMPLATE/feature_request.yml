name: Feature request
description: Suggest a manual-review workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Review workflow
      description: Which repetitive code-audit task should become easier?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how it should work inside VS Code.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This can work locally without uploading source code.
          required: true
        - label: This assists manual review rather than executing exploits.
          required: true
