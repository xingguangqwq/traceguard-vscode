name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test-output.log; then
            node -e 'const fs = require("node:fs"); const lines = fs.readFileSync("test-output.log", "utf8").split(/\r?\n/); const failures = lines.flatMap((line, index) => /^not ok\b/.test(line) ? [lines.slice(Math.max(0, index - 2), index + 45).join("\n")] : []); const text = failures.join("\n---\n") || lines.slice(-120).join("\n"); console.log(`::error title=Node test failure::${text.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A")}`);'
            exit 1
          fi

      - name: Check JavaScript syntax
        run: npm run check

      - name: Enforce Java backend baseline
        run: npm run benchmark:java

      - name: Enforce PHP backend baseline
        run: npm run benchmark:php

      - name: Enforce Python backend baseline
        run: npm run benchmark:python

      - name: Enforce TypeScript dependency invalidation baseline
        run: npm run benchmark -- --fixture=typescript-dependents --files=100 --max-incremental-ms=500 --max-rss-mib=500

      - name: Compare evaluation baseline
        run: npm run eval:compare

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm run test:extension-host

      - name: Package VSIX
        run: npm run package

      - name: Verify packaged AST runtimes
        shell: bash
        run: |
          package_root=$(mktemp -d)
          unzip -q traceguard-*.vsix -d "$package_root"
          node scripts/verify-packaged-runtime.js "$package_root/extension"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: traceguard-vsix
          path: traceguard-*.vsix
          if-no-files-found: error
