name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Package VSIX
        run: npm run package

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -s "$notes" ]]; then
            echo "::error::Missing handwritten release notes: $notes"
            exit 1
          fi
          asset=$(ls ./traceguard-*.vsix)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "TraceGuard $GITHUB_REF_NAME" \
              --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "TraceGuard $GITHUB_REF_NAME" \
              --notes-file "$notes"
          fi
