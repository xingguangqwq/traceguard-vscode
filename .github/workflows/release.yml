name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Enforce Java backend baseline
        run: npm run benchmark:java

      - name: Enforce PHP backend baseline
        run: npm run benchmark:php

      - name: Enforce Python backend baseline
        run: npm run benchmark:python

      - name: Enforce TypeScript dependency invalidation baseline
        run: npm run benchmark -- --fixture=typescript-dependents --files=100 --max-incremental-ms=500 --max-rss-mib=500

      - name: Compare evaluation baseline
        run: npm run eval:compare

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm run test:extension-host

      - name: Package VSIX
        run: npm run package

      - name: Verify packaged AST runtimes
        shell: bash
        run: |
          package_root=$(mktemp -d)
          unzip -q traceguard-*.vsix -d "$package_root"
          node scripts/verify-packaged-runtime.js "$package_root/extension"

      - name: Prepare reviewed release notes
        shell: bash
        run: |
          notes_source=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes_source" ]]; then
            echo "Missing reviewed release notes: $notes_source" >&2
            exit 1
          fi

          asset=$(ls ./traceguard-*.vsix)
          checksum=$(sha256sum "$asset" | awk '{print $1}')
          cp "$notes_source" release-notes.md
          printf '\n### SHA-256\n\n`%s`\n' "$checksum" >> release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          asset=$(ls ./traceguard-*.vsix)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "TraceGuard $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "TraceGuard $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
